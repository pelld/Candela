name: Electricity redesign
on:
  push:
    paths:
      - '.github/workflows/electricity-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch electricity visual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          old_css = r"\.circuit\{.*?\.flow\{font-size:1\.8rem\}"
          new_css = r'''.elecviz{height:220px;background:#f8fbff;box-shadow:inset 0 1px #fff9,0 7px 18px #14223c12}.elecviz svg{display:block;width:100%;height:100%}.e-wire{fill:none;stroke:#3157d5;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.e-component-bg{fill:#f8fbff}.e-resistor{fill:#fff;stroke:#3157d5;stroke-width:4}.e-meter{fill:#fff;stroke:#3157d5;stroke-width:4}.e-battery-line{stroke:#10223a;stroke-linecap:round}.e-charge{fill:#e04b3f;filter:drop-shadow(0 1px 1px #0002)}.e-label{font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.e-value{font:900 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#10223a}.e-current{font:900 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#10223a}.electric-note{margin-top:8px;color:var(--muted);font-size:.78rem;line-height:1.35}.electric-equation{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:12px;background:#f4f7ff;font-weight:850;color:#2546b1}.wavebox,.wavebox svg{width:100%;height:100%}'''
          s, n = re.subn(old_css, new_css, s, count=1, flags=re.S)
          assert n == 1, f'CSS replacement count {n}'

          branch_pat = r"else if\(topic==='electricity'\)\{content\.innerHTML=`.*?`;simElectricity\(\)\}"
          branch_new = r'''else if(topic==='electricity'){content.innerHTML=`<div class="muted">2 · EXPERIMENT</div><div class="question">${x.experimentTitle}</div><div class="controls"><div class="control"><label>Voltage <span id="vv">12 V</span></label><input id="volt" type="range" min="1" max="24" value="12" oninput="simElectricity()"></div><div class="control"><label>Resistance <span id="rr">4 Ω</span></label><input id="resist" type="range" min="1" max="20" value="4" oninput="simElectricity()"></div></div><div class="sim elecviz" id="elecviz"><svg id="circuitSvg" viewBox="0 0 420 220" aria-label="Closed electrical circuit"><path id="circuitPath" class="e-wire" d="M72 48 H348 Q370 48 370 70 V150 Q370 172 348 172 H72 Q50 172 50 150 V70 Q50 48 72 48 Z"/><rect class="e-component-bg" x="164" y="28" width="92" height="42" rx="8"/><rect class="e-resistor" x="174" y="35" width="72" height="28" rx="7"/><text id="resistorRead" class="e-value" x="210" y="55" text-anchor="middle">4 Ω</text><rect class="e-component-bg" x="30" y="82" width="42" height="56"/><line class="e-battery-line" x1="41" y1="95" x2="67" y2="95" stroke-width="5"/><line class="e-battery-line" x1="46" y1="119" x2="62" y2="119" stroke-width="3"/><text id="batteryRead" class="e-value" x="92" y="113">12 V</text><rect class="e-component-bg" x="174" y="149" width="72" height="46" rx="10"/><circle class="e-meter" cx="210" cy="172" r="22"/><text class="e-value" x="210" y="178" text-anchor="middle">A</text><text class="e-label" x="210" y="100" text-anchor="middle">CURRENT</text><text id="currentRead" class="e-current" x="210" y="128" text-anchor="middle">3.00 A</text>${Array.from({length:8},(_,i)=>`<circle class="e-charge" r="5"><animateMotion class="chargeMotion" dur="2.4s" begin="-${(i*.3).toFixed(1)}s" repeatCount="indefinite"><mpath href="#circuitPath"/></animateMotion></circle>`).join('')}</svg></div><div class="electric-equation" id="sr">12 V ÷ 4 Ω = 3.00 A</div><div class="electric-note">The dots represent charge already in the circuit. More voltage makes charge flow faster; more resistance slows the flow.</div><div class="actions"><button class="btn" onclick="step=2;renderTopic()">Explain →</button></div>`;simElectricity()}'''
          s, n = re.subn(branch_pat, branch_new, s, count=1, flags=re.S)
          assert n == 1, f'branch replacement count {n}'

          sim_pat = r"function simElectricity\(\)\{.*?\}function simWaves\(\)"
          sim_new = r'''function simElectricity(){let v=+volt.value,r=+resist.value,i=v/r;vv.textContent=v+' V';rr.textContent=r+' Ω';batteryRead.textContent=v+' V';resistorRead.textContent=r+' Ω';currentRead.textContent=i.toFixed(2)+' A';sr.textContent=v+' V ÷ '+r+' Ω = '+i.toFixed(2)+' A';let dur=Math.max(.75,7/(1+Math.sqrt(i)*1.1));document.querySelectorAll('.chargeMotion').forEach((a,k)=>{a.setAttribute('dur',dur.toFixed(2)+'s');a.setAttribute('begin',(-dur*k/8).toFixed(2)+'s')})}function simWaves()'''
          s, n = re.subn(sim_pat, sim_new, s, count=1, flags=re.S)
          assert n == 1, f'sim replacement count {n}'

          s = s.replace("experimentTitle:'Change voltage and resistance. Watch the current.'","experimentTitle:'Change voltage and resistance. Watch charge flow.'")
          s = s.replace("explain:'For a fixed voltage, increasing resistance makes it harder for charge to flow, so <strong>current decreases</strong>. If resistance doubles, current halves.'","explain:'Current is the rate of flow of charge around a complete circuit. Increasing <strong>voltage</strong> increases the current; increasing <strong>resistance</strong> reduces it. The same current flows all around this simple series circuit.'")

          p.write_text(s)
          PY
          rm .github/workflows/electricity-redesign.yml
          git config user.name "pelld"
          git config user.email "5339514+pelld@users.noreply.github.com"
          git add index.html .github/workflows/electricity-redesign.yml
          git commit -m "Replace electricity visual with animated circuit"
          git push
