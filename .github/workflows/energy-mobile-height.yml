name: Energy mobile height
on:
  push:
    branches: [main]
    paths: ['.github/workflows/energy-mobile-height.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.stopviz,.energyviz{height:250px}'
          new='.stopviz{height:250px}.energyviz{height:190px}'
          if old not in s:
              raise SystemExit('mobile height rule not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove one-off workflow
        run: |
          git config user.name "pelld"
          git config user.email "5339514+pelld@users.noreply.github.com"
          git rm .github/workflows/energy-mobile-height.yml
          git add index.html
          git commit -m "Fix Energy panel height on mobile"
          git push
