name: Energy mobile cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/energy-mobile-cleanup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify Energy experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Replace the Energy visual CSS with a much simpler phone-first layout.
          css = r'''.energyviz{height:190px;background:linear-gradient(#eef6ff 0 72%,#d4dde7 72% 75%,#4a5563 75%);box-shadow:inset 0 1px #fff9,0 7px 18px #14223c12}.energyviz .etrack{position:absolute;left:5%;right:5%;bottom:48px;height:5px;background:#222c39;border-radius:8px}.energyviz .brake-zone{position:absolute;left:22%;right:5%;bottom:54px;height:60px;background:#fff9ec;border-top:2px solid #d8a84f;border-bottom:2px solid #d8a84f}.energyviz .brake-zone:before{content:"10 N BRAKING FORCE";position:absolute;left:8px;top:6px;font-size:.52rem;font-weight:900;color:#7b5711;letter-spacing:.02em}.energyviz .tick{position:absolute;bottom:0;width:1px;height:18px;background:#a67b2d}.energyviz .tick span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:.48rem;font-weight:800;color:#64748b;white-space:nowrap}.energyviz .brake-line{position:absolute;left:22%;bottom:46px;width:3px;height:76px;background:#c66e06;z-index:4}.energyviz .brake-line:before{content:"BRAKES ON";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.5rem;font-weight:900;color:#805b13;white-space:nowrap}.energyviz .stop-line{position:absolute;bottom:46px;width:3px;height:76px;background:#17824f;z-index:5;transition:left .18s ease}.energyviz .stop-line:before{content:attr(data-label);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#17824f;color:#fff;border-radius:999px;padding:3px 6px;font-size:.5rem;font-weight:900;white-space:nowrap}.energyviz .distance-bar{position:absolute;left:22%;bottom:61px;height:10px;background:#3157d5;border-radius:0 8px 8px 0;opacity:.8;transition:width .18s ease}.energyviz .trolley{position:absolute;left:5%;bottom:54px;width:52px;height:27px;background:#f5c243;border-radius:7px 10px 4px 4px;z-index:6}.energyviz .trolley:before,.energyviz .trolley:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#1d2733;bottom:-5px}.energyviz .trolley:before{left:7px}.energyviz .trolley:after{right:7px}.energyviz .mass-label{position:absolute;inset:4px 0 auto;text-align:center;font-size:.56rem;font-weight:900;color:#6f5107}.energy-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.energy-metrics .dm{padding:9px 5px}.energy-note{margin-top:8px;color:var(--muted);font-size:.76rem;line-height:1.3}'''
          s, n = re.subn(r'\.energyviz\{.*?\.energy-metrics \.dm\{padding:9px 5px\}', css, s, count=1)
          if n != 1:
              raise SystemExit('Energy CSS block not found')

          # Replace the Energy experiment markup. Keep the physics visible before Animate is pressed.
          energy_html = r'''else if(topic==='energy'){content.innerHTML=`<div class="muted">2 · EXPERIMENT</div><div class="question">Change mass and speed. Same brakes every time.</div><p class="muted" style="margin:-8px 0 12px">The trolley always meets the same 10 N braking force.</p><div class="controls"><div class="control"><label>Mass <span id="mv">2 kg</span></label><input id="mass" type="range" min="1" max="5" value="2" oninput="simEnergy()"></div><div class="control"><label>Speed <span id="ev">3 m/s</span></label><input id="espeed" type="range" min="1" max="6" value="3" oninput="simEnergy()"></div></div><div class="sim energyviz" id="energyviz"><div class="brake-zone"><div class="tick" style="left:0%"><span>0</span></div><div class="tick" style="left:20%"><span>2 m</span></div><div class="tick" style="left:40%"><span>4</span></div><div class="tick" style="left:60%"><span>6</span></div><div class="tick" style="left:80%"><span>8</span></div><div class="tick" style="left:100%"><span>10 m</span></div></div><div class="distance-bar" id="distanceBar"></div><div class="brake-line"></div><div class="stop-line" id="stopLine" data-label="STOP 0.90 m"></div><div class="etrack"></div><div class="trolley" id="etrolley"><div class="mass-label" id="massLabel">2 kg</div></div></div><div class="result" id="sr"></div><div class="actions"><button class="btn secondary" onclick="animateEnergy()">Animate</button><button class="btn" onclick="step=2;renderTopic()">Explain →</button></div>`;simEnergy()}'''
          s, n = re.subn(r"else if\(topic==='energy'\)\{content\.innerHTML=`.*?`;simEnergy\(\)\}", energy_html, s, count=1)
          if n != 1:
              raise SystemExit('Energy HTML block not found')

          # Replace Energy physics/animation code. Fixed 10 N force: distance = KE / force.
          energy_js = r'''function energyModel(){let m=+mass.value,v=+espeed.value,F=10,ke=.5*m*v*v,d=ke/F,maxD=10,zoneLeft=.22,zoneRight=.05,zoneFrac=1-zoneLeft-zoneRight,zonePx=energyviz.clientWidth*zoneFrac,stopPx=energyviz.clientWidth*zoneLeft+zonePx*Math.min(1,d/maxD),cartStart=energyviz.clientWidth*.05,brakePx=energyviz.clientWidth*zoneLeft,travelToBrake=brakePx-cartStart;return{m,v,F,ke,d,maxD,zonePx,stopPx,travelToBrake}}function simEnergy(){let E=energyModel();mv.textContent=E.m+' kg';ev.textContent=E.v+' m/s';massLabel.textContent=E.m+' kg';let frac=Math.min(1,E.d/E.maxD);distanceBar.style.width=(E.zonePx*frac)+'px';stopLine.style.left=E.stopPx+'px';stopLine.dataset.label='STOP '+E.d.toFixed(2)+' m';etrolley.style.transition='none';etrolley.style.transform='translateX(0)';sr.innerHTML='<div class="energy-metrics"><div class="dm"><span>Kinetic energy</span><strong>'+E.ke.toFixed(1)+' J</strong></div><div class="dm"><span>Stopping distance</span><strong>'+E.d.toFixed(2)+' m</strong></div></div><div class="energy-note">With the same 10 N brake: double the mass → double the distance; double the speed → four times the distance.</div>'}function animateEnergy(){let E=energyModel(),scale=.65;etrolley.style.transition='none';etrolley.style.transform='translateX(0)';let cruiseMs=Math.max(180,(2.5/E.v)*1000*scale);requestAnimationFrame(()=>{etrolley.style.transition='transform '+cruiseMs+'ms linear';etrolley.style.transform='translateX('+E.travelToBrake+'px)'});setTimeout(()=>{let a=E.F/E.m,tStop=E.v/a,duration=Math.max(260,tStop*1000*scale),start=performance.now(),startX=E.travelToBrake;function frame(now){let elapsed=Math.min(duration,now-start),t=elapsed/(1000*scale),d=Math.min(E.d,E.v*t-.5*a*t*t),px=E.zonePx*(d/E.maxD);etrolley.style.transition='none';etrolley.style.transform='translateX('+(startX+px)+'px)';if(elapsed<duration)requestAnimationFrame(frame)}requestAnimationFrame(frame)},cruiseMs)}'''
          s, n = re.subn(r'function energyModel\(\).*?(?=function simElectricity\()', energy_js, s, count=1)
          if n != 1:
              raise SystemExit('Energy JS block not found')

          # Keep the explanation consistent with the new fixed-force experiment.
          s = s.replace("experimentTitle:'Change mass and speed. Watch where the trolley stops.'", "experimentTitle:'Change mass and speed. Same brakes every time.'")

          p.write_text(s)
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "pelld"
          git config user.email "5339514+pelld@users.noreply.github.com"
          git rm .github/workflows/energy-mobile-cleanup.yml
          git add index.html
          git commit -m "Simplify Energy experiment on mobile"
          git push
